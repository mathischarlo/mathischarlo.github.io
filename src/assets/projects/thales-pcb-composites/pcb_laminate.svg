<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t">
  <title id="t">Schematic cross-section of an aged glass/epoxy PCB laminate with a magnified view of microcracks and porosity</title>
  <defs>
    <pattern id="fib" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="8" fill="#9FB3C8"/>
    </pattern>
    <clipPath id="lens"><circle cx="880" cy="330" r="190"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <!-- laminate cross-section -->
  <g transform="translate(70 170)">
    <rect width="620" height="22" fill="#B87333"/>
    <rect y="22" width="620" height="78" fill="#E9EEF4"/>
    <rect y="22" width="620" height="78" fill="url(#fib)" opacity="0.7"/>
    <rect y="100" width="620" height="26" fill="#D7DFE8"/>
    <rect y="126" width="620" height="78" fill="#E9EEF4"/>
    <rect y="126" width="620" height="78" fill="url(#fib)" opacity="0.7"/>
    <rect y="204" width="620" height="26" fill="#D7DFE8"/>
    <rect y="230" width="620" height="78" fill="#E9EEF4"/>
    <rect y="230" width="620" height="78" fill="url(#fib)" opacity="0.7"/>
    <rect y="308" width="620" height="22" fill="#B87333"/>
    <!-- oxidised surface layer -->
    <rect y="-12" width="620" height="12" fill="#F28C28" opacity="0.55"/>
    <rect width="620" height="330" fill="none" stroke="#0A1A30" stroke-width="2"/>
    <!-- marker for magnified zone -->
    <circle cx="520" cy="160" r="46" fill="none" stroke="#0A1A30" stroke-width="3"/>
  </g>
  <line x1="636" y1="312" x2="692" y2="318" stroke="#0A1A30" stroke-width="3"/>
  <!-- magnified view -->
  <g clip-path="url(#lens)">
    <rect x="690" y="140" width="380" height="380" fill="#E9EEF4"/>
    <g fill="#9FB3C8">
      <circle cx="760" cy="230" r="34"/><circle cx="850" cy="220" r="34"/><circle cx="940" cy="232" r="34"/><circle cx="1030" cy="222" r="34"/>
      <circle cx="790" cy="430" r="34"/><circle cx="880" cy="440" r="34"/><circle cx="970" cy="428" r="34"/>
    </g>
    <rect x="690" y="300" width="380" height="60" fill="#D7DFE8"/>
    <!-- delamination / microcrack -->
    <path d="M700 330 L760 322 L800 336 L850 326 L905 340 L940 328" fill="none" stroke="#0A1A30" stroke-width="4" stroke-linecap="round"/>
    <path d="M850 220 m-34 0 a34 34 0 0 1 20 -31" fill="none" stroke="#0A1A30" stroke-width="4"/>
    <!-- porosity -->
    <ellipse cx="1000" cy="336" rx="16" ry="10" fill="#ffffff" stroke="#0A1A30" stroke-width="2"/>
    <ellipse cx="1036" cy="320" rx="9" ry="6" fill="#ffffff" stroke="#0A1A30" stroke-width="2"/>
  </g>
  <circle cx="880" cy="330" r="190" fill="none" stroke="#0A1A30" stroke-width="4"/>
  <!-- labels -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#0A1A30">
    <text x="70" y="130">AGED GLASS/EPOXY LAMINATE</text>
    <text x="70" y="560">copper · glass/epoxy plies · resin-rich layers</text>
    <text x="700" y="580">microcracks · porosity · delamination</text>
  </g>
  <text x="70" y="610" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#B85E0B">oxidised surface layer</text>
</svg>
