<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t">
  <title id="t">Schematic of a UHF link between a satellite in orbit and a ground station</title>
  <rect width="1200" height="675" fill="#ffffff"/>
  <!-- orbit -->
  <path d="M-40 300 Q 600 -40 1240 300" fill="none" stroke="#9FB3C8" stroke-width="2" stroke-dasharray="6 10"/>
  <!-- Earth -->
  <path d="M-60 675 Q 600 430 1260 675 Z" fill="#13294B"/>
  <path d="M-60 675 Q 600 470 1260 675" fill="none" stroke="#4FA3D9" stroke-width="3" opacity="0.6"/>
  <!-- beam -->
  <path d="M832 176 L 300 520 L 392 540 Z" fill="#F28C28" opacity="0.14"/>
  <line x1="832" y1="176" x2="346" y2="530" stroke="#F28C28" stroke-width="3" stroke-dasharray="14 10"/>
  <!-- satellite -->
  <g transform="translate(832 176) rotate(-28)">
    <rect x="-130" y="-22" width="92" height="44" rx="3" fill="#1C3A63"/>
    <path d="M-130 0 H-38 M-107 -22 V22 M-84 -22 V22 M-61 -22 V22" stroke="#4FA3D9" stroke-width="2"/>
    <rect x="38" y="-22" width="92" height="44" rx="3" fill="#1C3A63"/>
    <path d="M38 0 H130 M61 -22 V22 M84 -22 V22 M107 -22 V22" stroke="#4FA3D9" stroke-width="2"/>
    <rect x="-38" y="-6" width="76" height="12" fill="#9FB3C8"/>
    <rect x="-30" y="-34" width="60" height="68" rx="6" fill="#0A1A30"/>
    <rect x="-30" y="-34" width="60" height="68" rx="6" fill="none" stroke="#F28C28" stroke-width="3"/>
    <line x1="0" y1="34" x2="0" y2="62" stroke="#0A1A30" stroke-width="4"/>
  </g>
  <!-- ground station -->
  <g transform="translate(346 548)">
    <rect x="-8" y="0" width="16" height="44" fill="#F2F5F9"/>
    <path d="M-60 -6 Q 0 -70 60 -6 Z" transform="rotate(-36)" fill="#F2F5F9"/>
    <line x1="0" y1="-14" x2="18" y2="-40" stroke="#F2F5F9" stroke-width="4"/>
    <rect x="-34" y="40" width="68" height="14" rx="3" fill="#F2F5F9"/>
  </g>
  <!-- labels -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#0A1A30">
    <text x="900" y="270">SATELLITE</text>
    <text x="440" y="420" fill="#B85E0B">UHF LINK</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#F2F5F9">
    <text x="436" y="618">GROUND STATION</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#44546A">
    <text x="60" y="80">P_tx + G_tx − L_fs − L_atm + G_rx</text>
    <text x="60" y="112">→ received power → link margin</text>
  </g>
</svg>
